services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    env_file: config.env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - hdhive-data:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  hdhive-data:
