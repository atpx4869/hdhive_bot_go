services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: config.env
    volumes:
      - hdhive-data:/data
    restart: unless-stopped
    # 安全加固选项
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  hdhive-data:
